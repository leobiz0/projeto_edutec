<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InovaAI - Entrar</title>
<meta name="description" content="Acesse sua conta na InovaAI.">
<link rel="icon" type="image/png" href="/favicon.png">
<meta property="og:title" content="InovaAI — Entrar">
<meta property="og:description" content="Acesse sua conta na InovaAI.">
<meta property="og:image" content="/og-image.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/pages/entrar.css">
<script src="/js/fill-screen.js"></script>
</head>
<body>
<div class="page page-entrar">

  <img class="entrar-bg-1" src="/assets/images/entrar-bg.png" alt="">
  <div class="entrar-bg-2">
    <img src="/assets/images/entrar-bg.png" alt="">
  </div>

  <a class="entrar-back" href="/">
    <img src="/assets/icons/arrow-back.png" alt="Voltar" style="width:100%;height:100%;">
  </a>

  <div class="entrar-logo logo-crop"><img src="/assets/images/logo.png" alt="InovaAI"></div>

  <div class="entrar-card"></div>

  <h1 class="entrar-title">ENTRAR</h1>
  <p class="entrar-subtitle">Acesse sua conta para continuar.</p>

  <div class="entrar-field entrar-field-email"></div>
  <label class="entrar-label entrar-label-email">Digite seu email:</label>

  <div class="entrar-field entrar-field-senha"></div>
  <label class="entrar-label entrar-label-senha">Digite sua senha:</label>

  <img class="entrar-btn" src="/assets/icons/rectangle-button.svg" alt="">
  <button class="entrar-btn-label">Continuar</button>

  <img class="entrar-divider" src="/assets/icons/line-divider.svg" alt="">
  <div class="entrar-divider-pill"></div>
  <p class="entrar-divider-label">ou</p>

  <div class="entrar-google-btn"></div>
  <img class="entrar-google-icon" src="/assets/images/google-icon.png" alt="Google">
  <p class="entrar-google-label">Fazer Login com o Google</p>

  <a class="entrar-signup-link" href="/cadastro/">Ainda não tem um cadastro ?<br><b>Criar conta.</b></a>

</div>
</body>
</html>
